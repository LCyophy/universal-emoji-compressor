[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "universal-emoji-compressor"
version = "0.2.0"
description = "通用表情包压缩、OCR、视觉理解与可搜索索引工具"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "LCyophy" }]
keywords = ["emoji", "meme", "gif", "ocr", "image-compression", "image-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "Pillow>=11.0",
  "numpy>=2.0",
  "opencv-contrib-python>=4.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.0"]
vision = [
  "torch>=2.7",
  "transformers>=4.57",
  "accelerate>=1.6",
  "qwen-vl-utils>=0.0.14",
]
all = [
  "paddleocr>=3.0",
  "torch>=2.7",
  "transformers>=4.57",
  "accelerate>=1.6",
  "qwen-vl-utils>=0.0.14",
]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/LCyophy/universal-emoji-compressor"
Repository = "https://github.com/LCyophy/universal-emoji-compressor"
Issues = "https://github.com/LCyophy/universal-emoji-compressor/issues"

[project.scripts]
emoji-compress = "universal_emoji_compressor.cli:main"
emoji-index = "universal_emoji_compressor.vision:main"
emoji-export = "universal_emoji_compressor.export:main"
emoji-pipeline = "universal_emoji_compressor.orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_emoji_compressor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/universal_emoji_compressor/core.py" = ["BLE001"]